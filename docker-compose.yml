# Local infrastructure only. Run apps from your IDE/`dotnet run`; they connect to these.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: vocaleye
      POSTGRES_PASSWORD: vocaleye
      POSTGRES_DB: vocaleye
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  otel-dashboard:            # OpenTelemetry traces/logs/metrics UI at http://localhost:18888
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
    ports: ["18888:18888", "4317:18889"]
volumes:
  pgdata:
